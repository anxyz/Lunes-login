name: 更新时间

on:
  schedule:
    - cron: '10 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunes-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 写入时间
        continue-on-error: true
        env:
          ACTIVITY_BRANCH: ${{ github.event.repository.default_branch }}
          ACTIVITY_OWNER_ID: ${{ github.repository_owner_id }}
        run: bash scripts/update-activity.sh
