name: Auto-login-Lunes
on:
  workflow_dispatch:
    inputs:
      notify:
        description: '发送 Telegram 通知'
        type: boolean
        default: true
  schedule:
    - cron: '30 21 * * 5' # UTC 周五 21:30，即北京时间每周六 05:30

jobs:
  Renew-lunes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v6
      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: 🛠️ 安装系统依赖和Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install xvfb x11-utils xdotool scrot fonts-noto-cjk -y
          pip install seleniumbase aiohttp requests
          seleniumbase install chromedriver

      - name: 🧪 检查登录回归测试
        run: python3 -m unittest discover -s tests -v

      - name: 🌐 设置sing-box代理转发
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }} # 在secret里设置 NODE_LINK 代理启用代理 
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "未配置 NODE_LINK，直连访问"
            exit 0
          fi
          curl --fail --silent --show-error --location --retry 3 \
            https://main.ssss.nyc.mn/setup_proxy.sh -o "$RUNNER_TEMP/setup_proxy.sh"
          for attempt in 1 2 3; do
            if bash "$RUNNER_TEMP/setup_proxy.sh"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "代理初始化失败，5 秒后重试（第 $attempt 次）"
              sleep 5
            fi
          done
          echo "::error::代理初始化连续失败，请检查 NODE_LINK 和上游网络连接"
          exit 1
 
      - name: 🚀 运行续期脚本
        env:
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SEND_TG: ${{ github.event_name != 'workflow_dispatch' || inputs.notify }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py
